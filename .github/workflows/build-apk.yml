name: Build Cricket Auction APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          echo "ZIP files:"
          ls -lh *.zip

          unzip -o CricketAuctionPorbandar_Clean_New.zip

          echo "Extracted project:"
          find CricketAuctionPorbandar -maxdepth 2 -type f | sort

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p CricketAuctionPorbandar \
            assembleDebug

      - name: Check APK
        run: |
          ls -lh CricketAuctionPorbandar/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricketAuctionPorbandar-APK
          path: CricketAuctionPorbandar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
