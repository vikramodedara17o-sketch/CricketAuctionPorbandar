name: Build Cricket Auction APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check Project
        run: |
          echo "===== Files ====="
          ls -la
          echo "===== Project ====="
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p CricketAuctionPorbandar \
            assembleDebug

      - name: Find APK
        run: |
          find CricketAuctionPorbandar -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricketAuctionPorbandar-debug-apk
          path: CricketAuctionPorbandar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
