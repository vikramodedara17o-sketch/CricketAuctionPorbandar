name: Build Cricket Auction APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find and Extract Project
        run: |
          echo "===== Repository files ====="
          ls -la

          echo "===== ZIP files ====="
          find . -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE"

          echo "===== Extracted files ====="
          find . -maxdepth 4 -type f | sort

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle*" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            echo "Searching for build.gradle files:"
            find . -type f -name "build.gradle*" -print
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          echo "===== Building Android APK ====="
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricketAuctionPorbandar-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
